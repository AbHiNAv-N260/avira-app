services:
  - type: web
    name: avira
    runtime: node
    buildCommand: npm install --prefix backend
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: avira-data
      mountPath: /var/data
      sizeGB: 1
